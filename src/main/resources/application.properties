# Properties may be overridden in this optional properties file.
spring.config.import=optional:classpath:env.properties
spring.application.name=avenirs-portfolio-security
spring.profiles.active=prod
server.address=0.0.0.0
server.port=12000
# suppress inspection "SpellCheckingInspection"
server.tomcat.additional-tld-skip-patterns=org.apache.tomcat.util.compat.Jre22Compat
# Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/avenirs-portfolio-security/api-docs
springdoc.swagger-ui.path=/avenirs-portfolio-security/swagger-ui
# Persistence
spring.datasource.url=jdbc:postgresql://localhost:65432/avenirs_access_control
spring.datasource.username=avenirs_security_admin
# suppress inspection "SpellCheckingInspection"
spring.datasource.password=ENC(nrhrW8giUqCjQzWRBDVj/XYVStp8Tgxs)
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.default-schema=dev
# Hikari
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1
#spring.datasource.hikari.validation-timeout=3000
# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=false
spring.liquibase.default-schema=dev
spring.liquibase.parameters.avenirs.admin.role=avenirs_security_admin_role
# CORS Configuration
cors.allowed-origins=*
cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=false
# Jasypt
jasypt.encryptor.algorithm=PBEWithMD5AndDES
jasypt.encryptor.iv-generator-classname=org.jasypt.iv.NoIvGenerator
jasypt.encryptor.password=${jasypt-encryptor-password}
# Logging
logging.level.root=info
logging.level.fr.avenirsesr=info
logging.level.org.apache.http.wire=error
logging.level.liquibase=error
logging.level.org.hibernate.sql=error
logging.level.org.hibernate.type.descriptor.sql.basic-binder=error
logging.level.com.github.ulisesbocchio.jasypt=error
logging.file.name=logs/avenirs-portfolio-security.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.file.max-size=10MB
logging.file.max-history=30
# Actuators
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.actuator.base.path=/actuator
management.actuator.health.path=${management.actuator.base.path}/health

avenirs.env=dev

# ---- Avenirs specific settings ----
avenirs.apim.base.uri=apisix-gw
avenirs.access.control=/access-control
avenirs.access.control.date.format=yyyy/MM/dd
avenirs.access.control.grant=${avenirs.access.control}/grant
avenirs.access.control.authorize=${avenirs.access.control}/authorize
avenirs.access.control.roles=/roles
avenirs.authentication.oidc.login=/oidc/login
avenirs.authentication.oidc.callback=/oidc/callback
avenirs.authentication.oidc.callback.redirect=/oidc/redirect
avenirs.authentication.oidc.callback.introspect=/oidc/introspect
avenirs.authentication.oidc.callback.profile=/oidc/profile

# --- CAS OIDC provider (internal docker network) ---
avenirs.authentication.oidc.provider=avenirs-apache

# --- Public browser URL ---
avenirs.authentication.oidc.public.base-url=https://${avenirs.env}.avenirs-esr.fr/cas

# --- Browser redirects ---
avenirs.authentication.oidc.authorize.url=${avenirs.authentication.oidc.public.base-url}/oidc/oidcAuthorize
avenirs.authentication.oidc.logout.url=${avenirs.authentication.oidc.public.base-url}/logout

# --- Internal server-to-server calls ---
avenirs.authentication.oidc.token.url=https://${avenirs.authentication.oidc.provider}/cas/oidc/token
avenirs.authentication.oidc.provider.introspect.url=https://${avenirs.authentication.oidc.provider}/cas/oidc/introspect?token=%s
avenirs.authentication.oidc.provider.profile.url=https://${avenirs.authentication.oidc.provider}/cas/oidc/profile?token=%s
avenirs.authentication.oidc.provider.jwks.url=https://${avenirs.authentication.oidc.provider}/cas/oidc/jwks

# --- OIDC client ---
avenirs.authentication.service.template=http://%s/examples/retrieve-access-token.html
avenirs.authentication.oidc.authorise.template.url=https://%s/cas/oidc/oidcAuthorize?client_id=${avenirs.authentication.oidc.client.id}&redirect_uri=https://%s/avenirs-portfolio-security/auth/callback&state=%s&scope=openid profile email offline_access&response_type=code
avenirs.authentication.oidc.client.id=APIMClientId
avenirs.authentication.oidc.client.secret=ENC(8PpF/57cxrGjk8dlEREpBe7JkFzVsqvnh9ATMnm4NDysV4iROp1ak84onmHiK9dACa1WuivMZaLkRuZfM1A4CQ==)
avenirs.authentication.oidc.scope=openid profile email offline_access
avenirs.authentication.oidc.token.is.jwt=false
avenirs.authentication.oidc.iat.tolerance.seconds=4

# --- New browser/session authentication flow ---
avenirs.authentication.auth.base-path=/auth
avenirs.authentication.auth.login-path=/login
avenirs.authentication.auth.callback-path=/callback
avenirs.authentication.auth.logout-path=/logout
avenirs.authentication.auth.default-redirect-path=/cofolio/student
avenirs.authentication.auth.callback.public-path=/apim/v1/auth/callback
avenirs.authentication.auth.logout.default-service=https://${avenirs.env}.avenirs-esr.fr/cofolio/student

# --- Cookie settings ---
server.servlet.session.cookie.name=__Host-AVENIRS_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax

# --- Token exchange ---
avenirs.authentication.oidc.code.exchange.template.body=grant_type=authorization_code&client_id=${avenirs.authentication.oidc.client.id}&client_secret=${avenirs.authentication.oidc.client.secret}&redirect_uri=https://%s${avenirs.authentication.auth.callback.public-path}&code=%s&code_verifier=%s
avenirs.authentication.oidc.token.template.body=grant_type=password&username=%s&password=%s&client_id=${avenirs.authentication.oidc.client.id}&client_secret=${avenirs.authentication.oidc.client.secret}&scope=openid profile email offline_access
avenirs.authentication.oidc.refresh.template.body=grant_type=refresh_token&client_id=${avenirs.authentication.oidc.client.id}&client_secret=${avenirs.authentication.oidc.client.secret}&refresh_token=%s

# End points
avenirs.access.control.share.read=/share/read
avenirs.access.control.share.write=/share/write
avenirs.access.control.display=/display
avenirs.access.control.edit=/edit
avenirs.access.control.feedback=/feedback
avenirs.access.control.delete=/delete
# Mapping for jwt algorithm and Pam key generator algorithm
# 09/2024: only the RSA algo are actually supported in the JWT Service.
avenirs.jwt.alg.mapping.rs256=RSA
avenirs.jwt.alg.mapping.rs384=RSA
avenirs.jwt.alg.mapping.rs512=RSA
avenirs.jwt.alg.mapping.ps256=RSA
avenirs.jwt.alg.mapping.ps384=RSA
avenirs.jwt.alg.mapping.ps512=RSA
avenirs.jwt.alg.mapping.es256=EC
avenirs.jwt.alg.mapping.es384=EC
avenirs.jwt.alg.mapping.es512=EC
avenirs.jwt.alg.mapping.eddsa=EdDSA
security.authentication.filter=api-key
security.authentication.api-key=ENC(J7OlARbehNVLUlfwUnJ9/hOAchsliLyJ0UBN+gLvqUVO5/Z4V5irxThsBLpqbpLSXjJrzJejI2Y=)
security.permit-all-paths=/actuator/prometheus,/actuator/health,/actuator/caches,/avenirs-portfolio-security/api-docs/**,/avenirs-portfolio-security/swagger-ui/**,/favicon.ico,/actuator/health,/error
# Seeder
seeder.source=CSV
seeder.enabled=true
seeder.schema=dev
seeder.dependencies-check=true
seeder.principal.default-password=$2a$10$dWoBnpAc5LgApcQX6nDS6eRVgVham1LJU71n/Gqk/8xlPIifODzKC

avenirs.security.context.signature.current-kid=v2
avenirs.security.context.signature.ttl-seconds=300
avenirs.security.context.signature.algorithm=HmacSHA256

# Interoperability
avenirs.interoperability.base-url=http://localhost:10020/interoperability
avenirs.interoperability.actuator.health=http://localhost:10020/actuator/health
avenirs.interoperability.api-key=ENC(tfNG7vGZMGuUCwfLTfcuIcRY6zp5yg3sHsUrG+3Ys7uEOGE+swRhezj4/jmWJzg4dmoGxH6RhMQ=)
avenirs.interoperability.external-user.endpoint=${avenirs.interoperability.base-url}/external-users
avenirs.microservice.dependency.behaviour=WAIT
avenirs.microservice.dependency.timeout.seconds=600
avenirs.microservice.dependency.retry.interval.seconds=10